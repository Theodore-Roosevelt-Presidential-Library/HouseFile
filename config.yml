# HouseFile dashboard configuration
# ---------------------------------------------------------------
# Everything the collector needs to know about *your* Constant Contact
# account lives here, so the code can be reused by another organization
# without edits. Nothing in this file is personal data.

site:
  title: "TRPL Email House File"
  subtitle: "Constant Contact health, updated daily"
  timezone: "America/Denver"

# Field-completeness rules.
# The collector first looks at the contact's standard Constant Contact
# street address. If that is empty it falls back to the custom fields
# listed here (many sync tools write addresses into custom fields).
address_fallbacks:
  street: ["Acme - Billing Street"]
  city:   ["Acme - Billing City"]
  state:  ["Acme - Billing State"]
  zip:    ["Acme - Billing Zip"]
  country: ["Acme - Billing Country"]

# Source systems that feed the house file.
# A contact is attributed to a source when ANY of the match rules hit:
#   list:          contact is a member of a list with this exact name
#   source_system: the "Source System" custom field equals this value
#   custom_field_prefix: contact has any custom field whose label starts with this
# "last created" and "last updated" for each source are the newest
# created_at / updated_at among matching contacts, which is what tells you
# whether the nightly sync is still running.
source_system_field: "Source System"
sources:
  - key: acme
    label: "ACME"
    match:
      list: "Acme"
      source_system: "Acme"
      custom_field_prefix: "Acme - "
    opt_in_field: "Acme Opt In"
  - key: trailblazer
    label: "Trailblazer"
    match:
      list: "Trailblazer"
      source_system: "Trailblazer"
      custom_field_prefix: "Trailblazer - "
  - key: shopify
    label: "Shopify"
    match:
      list: "Shopify"
      source_system: "Shopify"
      custom_field_prefix: "Shopify - "
    opt_in_field: "Shopify Opt In"
  - key: clover
    label: "Clover"
    match:
      list: "Clover"
      source_system: "Clover"
      custom_field_prefix: "Clover - "
    opt_in_field: "Clover Opt In"
  - key: donorperfect
    label: "DonorPerfect"
    match:
      list: "DonorPerfect"
      source_system: "DonorPerfect"
      custom_field_prefix: "DonorPerfect - "
    opt_in_field: "Donor Perfect Opt In"

# Lists offered on the public sign-up page (https://www.trlibrary.com/newsletter).
# Matched on the text before " - " in the Constant Contact list name, so the
# long public descriptions can change without breaking the dashboard.
public_lists:
  - "Library News & History"
  - "Events & Programs"
  - "From the Archive"
  - "The Badlands"
  - "Conservation & Sustainability"
  - "Salt+Scoria"
  - "The Shop"
  - "Educators & Homeschool"
  - "Press & Media"

# Publish a table of EVERY list and its size? Internal list names can reveal
# things about donors and segments, so this is off by default.
include_all_lists: false

geo:
  # ZIP codes with fewer contacts than this are rolled into the state total
  # and never plotted individually.
  min_zip_count: 3
  # Where ZIP centroids come from (public reference data, not contact data).
  centroids_file: "docs/data/zip_centroids.json"
  # When a contact has a US ZIP but no state, derive the state from the ZIP
  # for the map and the "State (incl. inferred)" completeness line.
  # The plain "State" completeness figure always reflects what is on file.
  infer_state_from_zip: true

# "Dates & members" tab: the custom fields the ticketing / membership sync
# writes. Only counts are published (months, weekdays, lead-time buckets,
# levels); labels on fewer than min_cell contacts fold into "Other".
insights:
  visit_date_field: "Acme - Visit Date (Next)"
  purchase_date_field: "Acme - Last Purchase Date"
  membership_expiration_field: "Acme - Membership Expiration Date"
  membership_level_field: "Acme - Membership Level"
  active_member_field: "Acme - Is Active Member"
  ticket_type_field: "Acme - Ticket Type (Last)"
  home_state: "ND"        # booking lead time is compared for in-state vs out-of-state
  upcoming_days: 120      # daily view of upcoming visits
  min_cell: 3

# A contact is "stale" if it hasn't been updated in this many days.
stale_days: 365

# ---------------------------------------------------------------
# Automations tab
# ---------------------------------------------------------------
# Constant Contact's public API can read an automation's emails (subject,
# sender, HTML, send stats) but NOT the path itself (trigger, timing,
# filters). So the path structure is described here, and collect_automations.py
# fills in everything else from the API each morning. When you add or change
# a path in Constant Contact, mirror the trigger and timing here.
#
# Each path's campaign_id is the ID in its Constant Contact URL:
#   app.constantcontact.com/pages/cjb/workflow-reporting/<campaign_id>
# It identifies an email campaign, not a person. Draft paths that don't have
# an email yet can leave it out; they show on the page as "No email yet".
#
# PROPOSED paths are ideas for team review that are NOT in Constant Contact.
# Give them `status: proposed` and a `proposal:` block: the email's subject,
# preheader and sender, plus `html`, a file under docs/proposals/. The nightly
# refresh never touches docs/proposals/. When a proposal is built in Constant
# Contact, change its status, add the real campaign_id and drop the proposal
# block; from then on it refreshes from the API like any live path.
automations:
  # Fake contact used to fill personalization tags in previews. Never real data.
  sample_contact:
    FIRSTNAME: "Jane"
    LASTNAME: "Doe"
    EMAILADDRESS: "jane.doe@example.com"
    COMPANYNAME: "Doe Family Ranch"
    JOBTITLE: "Teacher"
    CITY: "Bismarck"
    STATE: "ND"
    POSTALCODE: "58501"
    PHONE: "(701) 555-0100"
    custom.acme_-_recent_order_id: "100482731"
    custom.acme_-_membership_number: "100245"
    custom.acme_-_membership_level: "Family"
    custom.acme_-_membership_expiration_date: "December 31"   # the preview page sets this from the trigger date
    custom.acme_-_ticket_type_last: "Member Adult"
    custom.acme_-_visit_date_next: "Saturday, June 12, 2027"  # the preview page sets this from the trigger date when the email is timed off it
    custom.acme_-_is_active_member: "active"                  # ACME writes active / new / dropped            # Acme - Ticket Type (Last); drives the "visited as a member" rows
    # Account tags (the Library's own details, filled by Constant Contact at send time)
    account.OrganizationName: "Theodore Roosevelt Presidential Library Foundation"
    account.AddressLine1: "401 East Main Avenue, Suite 201"
    account.City: "Bismarck"
    account.usState: "ND"
    account.PostalCode: "58501"

  # Email addresses allowed in the published automation data, besides each
  # email's own From and Reply-to. Anything else (e.g. a staff address that
  # Constant Contact filled into a preview) fails the privacy check.
  allowed_emails: ["hello@trlibrary.com", "membership@trlibrary.com"]
  allowed_email_domains: ["example.com"]   # the sample contact

  flows:
    - key: pre-visit
      label: "Pre-visit"
      description: "Ticket holders before they arrive. Triggered off the ACME visit date."
    - key: post-visit
      label: "Post-visit"
      description: "Follow-up after the visit: shop, stay connected, private events, what's next."
    - key: membership
      label: "Membership"
      description: "Turning ticket buyers into members, and keeping members renewing."
    - key: other
      label: "Other"
      description: "Paths not yet assigned to a flow."

  paths:
    - name: "VISIT: T-3 Pre-Visit Excitement"
      flow: pre-visit
      campaign_id: "a3df1186-26da-4b40-8602-c50cf797b9be"
      status: active
      activated: "2026-07-18"
      trigger:
        type: date_field
        field: "Acme - Visit Date (Next)"
        offset_days: -3
      filters: []
      action: "Send one email: what to expect, how long to plan, what to wear, parking and accessibility."

    - name: "VISIT: T-24h Trailblazer"
      flow: pre-visit
      campaign_id: "74b8112e-8aaa-47d8-a3a8-bc4141ab9eaf"
      status: active
      activated: "2026-07-30"
      trigger:
        type: date_field
        field: "Acme - Visit Date (Next)"
        offset_days: -1
      filters: []
      action: "Send one email asking the visitor to pre-register their Trailblazer wristband (link carries their ACME order ID)."

    # ---- Proposed: pre-visit welcome series (not in Constant Contact) ----
    # Lead time from ACME (Dates & members tab, Oct 2026): median 6 days; 23% book the same or
    # next day, 57% within a week, 16% more than 30 days out. T-3 and T-24h miss most
    # last-minute buyers, so the welcome goes out right after purchase: the day after, because
    # ACME syncs to Constant Contact overnight and the purchase date only lands the next day.
    - name: "VISIT: T+1 Welcome"
      flow: pre-visit
      status: proposed
      trigger: {type: date_field, field: "Acme - Last Purchase Date", offset_days: 1}
      filters: ["Acme - Visit Date (Next) is at least 3 days away when it sends, so last-minute buyers go straight to T-3 and T-24h (if Constant Contact can filter on it)"]
      action: "Sent the day after tickets are bought, once the overnight ACME sync has landed: the 3½-minute Library preview, the four things that are hard to plan in Medora (where to stay, getting here, planning the days, the national park), nearest airports and One Medora packages. Members are thanked; everyone else is offered membership with their ticket cost applied and their reservation kept."
      proposal:
        slug: visit-t1-welcome
        html: proposals/visit-t1-welcome.html
        subject: "You're going to Medora. Here's how to plan it."
        preheader: "Where to stay, how to get here and what to see, for your visit on [[custom.acme_-_visit_date_next]]."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "hello@trlibrary.com"
        reply_to: "hello@trlibrary.com"
        notes:
          - "Conditional rows switch on Acme - Is Active Member (active or new = member). Build sheet: proposals/visit-t1-welcome.buildsheet.txt."
          - "The premiere preview is an animated GIF teaser (987 KB) with a play button that links to the video page: email can't play video. Upload it and the thumbnails to the Constant Contact library before building."
          - "Ticket-to-membership: people email membership@trlibrary.com with their order number, or anyone at the front desk can handle the refund on the day (confirmed by Matt, 2026-10-20)."
          - "Confirm the merge-tag spelling for Acme - Visit Date (Next) and how it prints (the preview assumes a long date)."
          - "T+1, not T+0: ACME syncs to Constant Contact overnight, so the purchase date isn't there until the next day. Check that a 1-day-after trigger on Acme - Last Purchase Date fires for contacts whose date arrives that morning, and whether the path can skip visits in the next 3 days. Without that filter, someone visiting the day after buying would get the welcome after their visit."
    - name: "VISIT: T-30 Plan Ahead"
      flow: pre-visit
      status: proposed
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: -30}
      filters: []
      action: "For the 16% who book more than a month out: a checklist (lodging, evenings and seasonal attractions, the drive, a park day), their visit day with a link to that day's hours, winter road advice, the premiere preview and two short gallery and boardwalk videos, and the membership offer or a member thank-you."
      proposal:
        slug: visit-t-30-plan-ahead
        html: proposals/visit-t-30-plan-ahead.html
        subject: "One month to Medora: your planning checklist"
        preheader: "Lodging, seasonal hours and what to book before you go."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "hello@trlibrary.com"
        reply_to: "hello@trlibrary.com"
        notes:
          - "Hours: Constant Contact can't show the hours for one date (its rules only match exact values), so the email names the visit date and links to the hours page. A dynamic image like the weather card, drawn from a ?date= parameter, could show that day's hours if the Library builds one."
    - name: "VISIT: T-3 Know Before You Go"
      flow: pre-visit
      status: proposed
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: -3}
      filters: []
      action: "Proposed replacement for the live T-3 email: the entry window, a bring / leave-in-the-car table, parking, the live Medora weather card, making a day of it with the national park, the Trailblazer video, and a member welcome or the ticket-to-membership offer at the Welcome Desk."
      proposal:
        slug: visit-t-3-know-before
        html: proposals/visit-t-3-know-before.html
        subject: "Three days to the Badlands: what to know before you go"
        preheader: "Your entry window, parking, what to bring and how to make a day of it."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "hello@trlibrary.com"
        reply_to: "hello@trlibrary.com"
        notes:
          - "Would replace VISIT: T-3 Pre-Visit Excitement. Keep that one running until this is approved and built."
          - "Every fact is from the What to Know pages (tickets, getting here, during your visit, rules and safety), checked 2026-10-20."

    - name: "VISIT: T+3 Retail"
      flow: post-visit
      status: draft
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: 3}
      action: "No email built yet."

    - name: "VISIT: T+5 Ticket to Member"
      flow: membership
      status: draft
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: 5}
      action: "No email built yet."

    - name: "VISIT: T+12 Stay Connected"
      flow: post-visit
      status: draft
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: 12}
      action: "No email built yet."

    - name: "VISIT: T+30 Stay Engaged"
      flow: post-visit
      status: draft
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: 30}
      action: "No email built yet."

    - name: "VISIT: T+45 Private Events"
      flow: post-visit
      status: draft
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: 45}
      action: "No email built yet."

    - name: "VISIT: T+60 What's Next"
      flow: post-visit
      status: draft
      trigger: {type: date_field, field: "Acme - Visit Date (Next)", offset_days: 60}
      action: "No email built yet."

    # ---- Proposed: membership renewal series (not in Constant Contact) ----
    - name: "RENEW: T-60 Renewal Notice"
      flow: membership
      status: proposed
      trigger: {type: date_field, field: "Acme - Membership Expiration Date", offset_days: -60}
      filters: ["Acme - Is Active Member is active or new", "Not on auto-renew"]
      action: "First renewal notice, one email with conditional rows: Founding Members get a thank-you, permanent recognition on the Digital Donor Wall and an invitation to continue at Contributing; every other level sees its own renewal prices (1 year, auto-renew, 2 years), a nudge to the next level up, and a thank-you or visit invitation depending on their last ticket."
      proposal:
        slug: renew-t-60-renewal-notice
        html: proposals/renew-t-60-renewal-notice.html
        subject: "Two months left in your membership year"
        preheader: "Your level, your renewal options, and 10% off with auto-renew or two years."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "membership@trlibrary.com"
        reply_to: "membership@trlibrary.com"
        notes:
          - "Conditional rows switch on Acme - Membership Level (Founding Membership, Individual, Dual, Family, Contributing, Patron, Donor Patron) and Acme - Ticket Type (Last) (Member Adult or Member Youth = visited as a member). Use the switches above the preview."
          - "Founding Members: T-60 and T-30 ask them to continue at Contributing ($250). Dual or Family come in as the smaller, recovery option from T-7 on and in both lapsed emails."
          - "Constant Contact dynamic content works on rows in the drag-and-drop editor, not in custom-code emails, so this one goes into Constant Contact as a drag-and-drop email when it is approved."
          - "Members on auto-renew should not get this series. Constant Contact has no auto-renew field yet: ask ACME to sync one, or exclude them another way."
          - "Confirm the Founding Member wording on the Digital Donor Wall with Development."
          - "Confirm ACME renews from the same link for every level, including Founding to a standard level."
    - name: "RENEW: T-30 Reminder"
      flow: membership
      status: proposed
      trigger: {type: date_field, field: "Acme - Membership Expiration Date", offset_days: -30}
      filters: ["Acme - Is Active Member is active or new", "Not on auto-renew", "Not yet renewed"]
      action: "Full reminder, matching the first notice: the member's own price table, a visit thank-you or invitation, the next-level nudge and what renewing keeps; Founding Members are invited to continue at Contributing, with their permanent recognition."
      proposal:
        slug: renew-t-30-reminder
        html: proposals/renew-t-30-reminder.html
        subject: "One month left on your membership"
        preheader: "Renew by [[custom.acme_-_membership_expiration_date]]: your level, your price, and 10% off with auto-renew or two years."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "membership@trlibrary.com"
        reply_to: "membership@trlibrary.com"
        notes:
          - "\"Not yet renewed\" needs a Constant Contact filter: renewing moves the expiration date, which may end the path on its own. Test with one renewal."
    - name: "RENEW: T-7 Last Week"
      flow: membership
      status: proposed
      trigger: {type: date_field, field: "Acme - Membership Expiration Date", offset_days: -7}
      filters: ["Acme - Is Active Member is active or new", "Not on auto-renew", "Not yet renewed"]
      action: "Short last-week note with the member's own renewal price, signed by the membership team; Founding Members get Contributing first, with Dual or Family as the smaller option."
      proposal:
        slug: renew-t-7-last-week
        html: proposals/renew-t-7-last-week.html
        subject: "Your membership ends next week"
        preheader: "Your member benefits end on [[custom.acme_-_membership_expiration_date]]."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "membership@trlibrary.com"
        reply_to: "membership@trlibrary.com"
    - name: "RENEW: T+7 Membership Ended"
      flow: membership
      status: proposed
      trigger: {type: date_field, field: "Acme - Membership Expiration Date", offset_days: 7}
      filters: ["Acme - Is Active Member is not active (confirm the lapsed value, likely dropped)"]
      action: "Lapsed notice with the full sell: the member's own rejoin price table, a thank-you if they visited, the next-level nudge, what membership brings back and how to rejoin; Founding Members hear that their status and Digital Donor Wall name are permanent."
      proposal:
        slug: renew-t-plus-7-membership-ended
        html: proposals/renew-t-plus-7-membership-ended.html
        subject: "Your membership has ended"
        preheader: "Rejoin at your level and your free admission and member benefits come right back."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "membership@trlibrary.com"
        reply_to: "membership@trlibrary.com"
        notes:
          - "Confirm with ACME that a lapsed member renews with the same membership number."
    - name: "RENEW: T+45 Last Note"
      flow: membership
      status: proposed
      trigger: {type: date_field, field: "Acme - Membership Expiration Date", offset_days: 45}
      filters: ["Acme - Is Active Member is not active (confirm the lapsed value, likely dropped)"]
      action: "Final invitation: the member's own price table, what members get, and a one-question reply survey on why not; Founding Members are reminded their recognition is permanent."
      proposal:
        slug: renew-t-plus-45-last-note
        html: proposals/renew-t-plus-45-last-note.html
        subject: "One last note about your membership"
        preheader: "Your level is still here when you want it, and one question."
        from_name: "Theodore Roosevelt Presidential Library"
        from_email: "membership@trlibrary.com"
        reply_to: "membership@trlibrary.com"
        notes:
          - "Someone on the membership team should own the replies to membership@trlibrary.com."
