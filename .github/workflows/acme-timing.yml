name: ACME sync timing (diagnostic)

# Manual only. Prints hour-of-day counts of ACME contact updates and of date-based
# path sends, so the date-to-text sync can be scheduled between them. Counts only:
# no contact details reach this (public) log.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to look back"
        default: "14"

permissions:
  contents: read

concurrency:
  group: update-stats        # shares the Constant Contact refresh token with the daily job
  cancel-in-progress: false

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure timing
        env:
          CC_CLIENT_ID: ${{ secrets.CC_CLIENT_ID }}
          CC_CLIENT_SECRET: ${{ secrets.CC_CLIENT_SECRET }}
          CC_REFRESH_TOKEN: ${{ secrets.CC_REFRESH_TOKEN }}
          CC_ROTATED_TOKEN_FILE: ${{ runner.temp }}/rotated_token
        run: |
          set -o pipefail
          python tools/acme_timing.py --days "${{ inputs.days }}" | tee "${{ runner.temp }}/out.txt"
      - name: Privacy guard
        run: |
          f="${{ runner.temp }}/out.txt"
          if grep -Eq '@|[0-9a-f]{8}-[0-9a-f]{4}-' "$f"; then echo "::error::output contains an email or record ID"; exit 1; fi
      - name: Rotate CC_REFRESH_TOKEN secret if Constant Contact replaced it
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          f="${{ runner.temp }}/rotated_token"
          if [ -s "$f" ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set CC_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "Stored rotated refresh token."
            else
              echo "::warning::Constant Contact rotated the refresh token but no ADMIN_TOKEN secret is set."
            fi
            rm -f "$f"
          fi
