name: Update house file stats

on:
  schedule:
    # Daily at 05:17 America/Denver (11:17 UTC; 12:17 UTC in winter). Cron is UTC-only.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "stats (daily refresh), timing, date-text-dry-run, date-text-create-fields, date-text-test (25 contacts), date-text-apply (all contacts) or date-text-daily (changed in last 2 days)"
        default: "stats"

# Every job that talks to Constant Contact lives in this one workflow, in this one
# concurrency group: refresh tokens rotate, and two runs using the same token at once
# make Constant Contact revoke it.

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect aggregate statistics
        if: ${{ github.event_name == 'schedule' || inputs.task == 'stats' }}
        env:
          CC_CLIENT_ID: ${{ secrets.CC_CLIENT_ID }}
          CC_CLIENT_SECRET: ${{ secrets.CC_CLIENT_SECRET }}
          CC_REFRESH_TOKEN: ${{ secrets.CC_REFRESH_TOKEN }}
          CC_ROTATED_TOKEN_FILE: ${{ runner.temp }}/rotated_token
        run: python collect.py

      # Diagnostics and the date-to-text sync. Output is counts only (public log) and
      # is checked by the guard step below.
      - name: ACME sync timing (counts only)
        if: ${{ inputs.task == 'timing' }}
        env:
          CC_CLIENT_ID: ${{ secrets.CC_CLIENT_ID }}
          CC_CLIENT_SECRET: ${{ secrets.CC_CLIENT_SECRET }}
          CC_REFRESH_TOKEN: ${{ secrets.CC_REFRESH_TOKEN }}
          CC_ROTATED_TOKEN_FILE: ${{ runner.temp }}/rotated_token
        run: |
          set -o pipefail
          python tools/acme_timing.py --days 14 | tee "${{ runner.temp }}/out.txt"

      - name: Date fields to text
        if: ${{ startsWith(inputs.task, 'date-text') }}
        env:
          CC_CLIENT_ID: ${{ secrets.CC_CLIENT_ID }}
          CC_CLIENT_SECRET: ${{ secrets.CC_CLIENT_SECRET }}
          CC_REFRESH_TOKEN: ${{ secrets.CC_REFRESH_TOKEN }}
          CC_ROTATED_TOKEN_FILE: ${{ runner.temp }}/rotated_token
        run: |
          set -o pipefail
          case "${{ inputs.task }}" in
            date-text-apply) args="--apply" ;;
            date-text-test) args="--apply --limit 25 --wait" ;;
            date-text-daily) args="--apply --since-days 2" ;;
            date-text-create-fields) args="--create-fields" ;;
            *) args="" ;;
          esac
          python sync_date_text.py $args | tee "${{ runner.temp }}/out.txt"

      - name: Privacy guard for diagnostic output
        if: ${{ always() && (inputs.task == 'timing' || startsWith(inputs.task, 'date-text')) }}
        run: |
          f="${{ runner.temp }}/out.txt"
          [ -f "$f" ] || exit 0
          if grep -Eq '@|[0-9a-f]{8}-[0-9a-f]{4}-' "$f"; then echo "::error::output contains an email or record ID"; exit 1; fi

      # Constant Contact can issue a replacement refresh token. If it does, and an
      # ADMIN_TOKEN (a PAT with "secrets" write access to this repo) is configured,
      # store the new one automatically. Otherwise the job log carries a warning.
      - name: Rotate CC_REFRESH_TOKEN secret if Constant Contact replaced it
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          f="${{ runner.temp }}/rotated_token"
          if [ -s "$f" ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set CC_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "Stored rotated refresh token."
            else
              echo "::warning::Constant Contact rotated the refresh token but no ADMIN_TOKEN secret is set. Re-authorize and update CC_REFRESH_TOKEN manually."
            fi
            rm -f "$f"
          fi

      - name: Privacy guard — fail if anything that looks personal reached the output
        if: ${{ github.event_name == 'schedule' || inputs.task == 'stats' }}
        run: |
          set -e
          for f in docs/data/stats.json docs/data/history.json; do
            if grep -Eq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$f"; then echo "::error::email address found in $f"; exit 1; fi
            if grep -Eq '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$f"; then echo "::error::record identifier found in $f"; exit 1; fi
            if grep -Eq '\(?[0-9]{3}\)?[ .-][0-9]{3}[ .-][0-9]{4}' "$f"; then echo "::error::phone number found in $f"; exit 1; fi
          done
          # Automations: email templates, not contact records. Only the Library's own
          # sender addresses and the fake sample contact may appear.
          python collect_automations.py --check
          echo "Privacy guard passed."

      - name: Commit updated data
        if: ${{ github.event_name == 'schedule' || inputs.task == 'stats' }}
        run: |
          git config user.name "housefile-bot"
          git config user.email "housefile-bot@users.noreply.github.com"
          git add docs/data/stats.json docs/data/history.json docs/data/zip_centroids.json docs/data/automations.json docs/data/emails
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Daily stats refresh $(date -u +%F)"
          git push
